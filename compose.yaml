services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-cuti-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: laravel-cuti-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cuti
      MYSQL_USER: cuti
      MYSQL_PASSWORD: cuti_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: